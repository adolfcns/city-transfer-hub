name: fetch-and-deploy

on:
  schedule:
    - cron: '29 * * * *'      # 每小时检查外租快照与九源社媒时间线
  workflow_dispatch: {}       # 手动触发按钮
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 防止重叠运行；新任务会清理超过正常时长仍未结束的旧任务，避免整条队列永久堵塞
concurrency:
  group: fetch-deploy
  cancel-in-progress: true

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether the hourly backup is needed
        id: decide
        env:
          LOAN_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/loan-watch.json
          SOCIAL_STATUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/social-status.json
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Push/manual/Cloudflare dispatch: run normally"
            exit 0
          fi

          DECISION="$(node --input-type=module <<'NODE'
          const checks = [
            { name: 'Loan-watch', url: process.env.LOAN_DATA_URL, maxAge: 90 * 60 * 1000, fields: ['checked_at', 'generated_at'] },
            { name: 'Social', url: process.env.SOCIAL_STATUS_URL, maxAge: 50 * 60 * 1000, fields: ['last_success'] },
          ];
          let shouldRun = false;
          for (const check of checks) {
            try {
              const response = await fetch(`${check.url}?t=${Date.now()}`, { cache: 'no-store' });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const data = await response.json();
              const stamp = check.fields.map((field) => data[field]).find(Boolean);
              const age = Date.now() - new Date(stamp).getTime();
              const fresh = Number.isFinite(age) && age >= 0 && age < check.maxAge;
              console.error(`${check.name} age: ${Number.isFinite(age) ? Math.round(age / 60000) : 'unknown'} minutes`);
              if (!fresh) shouldRun = true;
            } catch (error) {
              console.error(`${check.name} freshness check failed: ${error.message}; run the backup`);
              shouldRun = true;
            }
          }
          console.log(shouldRun ? 'true' : 'false');
          NODE
          )"
          echo "should_run=$DECISION" >> "$GITHUB_OUTPUT"
          if [ "$DECISION" = "true" ]; then
            echo "Loan or social data needs an update; run the hourly job"
          else
            echo "Loan and social data are fresh; skip the redundant fetch"
          fi

  fetch-deploy:
    needs: freshness-check
    if: ${{ needs.freshness-check.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # 九个指定 X 信源通过本地 RSSHub 读取，不接入 YouTube、Instagram 或图片流。
      - name: Start RSSHub for the social feed
        if: ${{ env.TWITTER_AUTH_TOKEN != '' }}
        run: |
          IMG=ghcr.io/diygod/rsshub:latest
          docker pull -q "$IMG" || IMG=docker.io/diygod/rsshub:latest
          docker run -d --name rsshub -p 1200:1200 \
            -e NODE_ENV=production \
            -e LOGGER_LEVEL=error \
            -e CACHE_TYPE= \
            -e TWITTER_AUTH_TOKEN="$TWITTER_AUTH_TOKEN" \
            "$IMG"
          ok=""
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:1200/healthz > /dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -n "$ok" ]; then
            echo "RSSHub ready"
            echo "RSSHUB_URL=http://127.0.0.1:1200" >> "$GITHUB_ENV"
          else
            echo "::warning::RSSHub 启动失败，本轮社媒会保留上一版"
            docker logs rsshub | tail -20 || true
          fi

      - name: Update loan schedule and post-match data
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          export PREV_LOAN_WATCH_URL="${BASE}/data/loan-watch.json"
          node scripts/fetch-loan-watch.js

      - name: Update the nine-source social feed
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          export PREV_SOCIAL_FEED_URL="${BASE}/data/social-feed.json"
          export PREV_SOCIAL_STATUS_URL="${BASE}/data/social-status.json"
          export PREV_LEGACY_DATA_URL="${BASE}/data/items.json"
          node scripts/fetch-social-feed.js

      - name: Assemble site
        id: assemble
        run: |
          mkdir -p site/data
          cp -r static/. site/
          cp data/*.json site/data/
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" site/index.html

      # 主站优先发布：任何备用站故障都不能再阻断 GitHub Pages 更新
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        env:
          NODE_OPTIONS: --use-system-ca
        uses: actions/deploy-pages@v4

      - name: Wait before retrying GitHub Pages
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 10

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        continue-on-error: true
        env:
          NODE_OPTIONS: --use-system-ca
        uses: actions/deploy-pages@v4

      # 备用站遇到 Cloudflare 临时内部错误时自动重试三次
      - name: Mirror to Cloudflare Pages
        id: mirror
        if: ${{ always() && steps.assemble.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID="$(npx --yes wrangler@4 d1 list --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{ const rows=JSON.parse(s); const db=rows.find(x=>x.name==="city-reactions"); if(db) process.stdout.write(db.uuid||db.id||""); })')"
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@4 d1 create city-reactions --location apac
            DB_ID="$(npx --yes wrangler@4 d1 list --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{ const rows=JSON.parse(s); const db=rows.find(x=>x.name==="city-reactions"); if(db) process.stdout.write(db.uuid||db.id||""); })')"
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::D1 database city-reactions was not found after provisioning"
            exit 1
          fi
          echo "PRAYER_DB_ID=$DB_ID" >> "$GITHUB_ENV"

          cp cloudflare/pages-worker.js site/_worker.js
          cp cloudflare/pages-routes.json site/_routes.json
          PAGES_CONFIG_DIR="cloudflare/pages-deploy"
          mkdir -p "$PAGES_CONFIG_DIR"
          printf 'name = "city-transfer-hub"\ncompatibility_date = "2026-07-13"\npages_build_output_dir = "../../site"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "city-reactions"\ndatabase_id = "%s"\n' "$DB_ID" > "$PAGES_CONFIG_DIR/wrangler.toml"
          deployed=""
          for attempt in 1 2 3; do
            if (cd "$PAGES_CONFIG_DIR" && npx --yes wrangler@4 pages deploy --branch=main --commit-dirty=true); then
              deployed=1
              break
            fi
            echo "::warning::Cloudflare Pages 第 ${attempt} 次发布失败，稍后重试"
            sleep $((attempt * 10))
          done
          if [ -z "$deployed" ]; then
            echo "::error::Cloudflare Pages 连续三次发布失败；GitHub 主站已先完成更新"
            exit 1
          fi

      # 仅在代码推送时更新 Worker；定时/手动抓取不重复部署
      - name: Deploy Cloudflare Worker
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && steps.mirror.outcome == 'success' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOY_CONFIG="cloudflare/wrangler.deploy.toml"
          cp cloudflare/wrangler.toml "$DEPLOY_CONFIG"
          DB_ID="${PRAYER_DB_ID:-}"
          if [ -z "$DB_ID" ]; then
            echo "::error::D1 database binding was not prepared by the Pages deployment"
            exit 1
          fi
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "city-reactions"\ndatabase_id = "%s"\n' "$DB_ID" >> "$DEPLOY_CONFIG"
          echo "Deploying Worker with D1 binding DB -> $DB_ID"
          npx --yes wrangler@4 deploy --config "$DEPLOY_CONFIG"

      - name: Verify interaction APIs
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && steps.mirror.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://city-transfer-hub.pages.dev/prayer';
          const seasonBlessingUrl = 'https://city-transfer-hub.pages.dev/season-blessing';
          const reactionsUrl = 'https://city-transfer-hub.pages.dev/reactions?ids=api_smoke_read';
          const commentsUrl = 'https://city-transfer-hub.pages.dev/comments?ids=api_smoke_read';
          const commentDetailUrl = 'https://city-transfer-hub.pages.dev/comments?item=api_smoke_read&voter=api_smoke_voter_2026';
          const surveyUrl = 'https://city-transfer-hub.pages.dev/surveys?poll=summer_2026&voter=api_smoke_voter_2026';
          const coachSurveyUrl = 'https://city-transfer-hub.pages.dev/surveys?poll=maresca_league_debut_2026&voter=api_smoke_voter_2026';
          const departureSurveyUrl = 'https://city-transfer-hub.pages.dev/surveys?poll=summer_departure_heartbreak_2026&voter=api_smoke_voter_2026';
          const reservationsUrl = 'https://city-transfer-hub.pages.dev/reservations?feature=loan_watch_2026&voter=api_smoke_voter_2026';
          const shareEventsUrl = 'https://city-transfer-hub.pages.dev/share-events';
          const finaleStatsUrl = 'https://city-transfer-hub.pages.dev/finale-stats';
          const origin = 'https://adolfcns.github.io';
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: { Origin: origin },
              });
              const body = await response.json();
              const cors = response.headers.get('access-control-allow-origin');
              const seasonBlessingResponse = await fetch(seasonBlessingUrl, { headers: { Origin: origin } });
              const seasonBlessingBody = await seasonBlessingResponse.json();
              const seasonBlessingCors = seasonBlessingResponse.headers.get('access-control-allow-origin');
              const reactionsResponse = await fetch(reactionsUrl, { headers: { Origin: origin } });
              const reactionsBody = await reactionsResponse.json();
              const reactionsCors = reactionsResponse.headers.get('access-control-allow-origin');
              const commentsResponse = await fetch(commentsUrl, { headers: { Origin: origin } });
              const commentsBody = await commentsResponse.json();
              const commentsCors = commentsResponse.headers.get('access-control-allow-origin');
              const commentDetailResponse = await fetch(commentDetailUrl, { headers: { Origin: origin } });
              const commentDetailBody = await commentDetailResponse.json();
              const commentDetailCors = commentDetailResponse.headers.get('access-control-allow-origin');
              const surveyResponse = await fetch(surveyUrl, { headers: { Origin: origin } });
              const surveyBody = await surveyResponse.json();
              const surveyCors = surveyResponse.headers.get('access-control-allow-origin');
              const coachSurveyResponse = await fetch(coachSurveyUrl, { headers: { Origin: origin } });
              const coachSurveyBody = await coachSurveyResponse.json();
              const coachSurveyCors = coachSurveyResponse.headers.get('access-control-allow-origin');
              const departureSurveyResponse = await fetch(departureSurveyUrl, { headers: { Origin: origin } });
              const departureSurveyBody = await departureSurveyResponse.json();
              const departureSurveyCors = departureSurveyResponse.headers.get('access-control-allow-origin');
              const reservationsResponse = await fetch(reservationsUrl, { headers: { Origin: origin } });
              const reservationsBody = await reservationsResponse.json();
              const reservationsCors = reservationsResponse.headers.get('access-control-allow-origin');
              const shareEventsResponse = await fetch(shareEventsUrl, {
                method: 'POST',
                headers: { Origin: origin, 'content-type': 'application/json' },
                body: JSON.stringify({
                  event_id: `se_deployment_smoke_${Date.now()}_${attempt}`,
                  event_type: 'shared_visit',
                  target_id: 'deployment_smoke',
                  voter: 'api_smoke_voter_2026',
                }),
              });
              const shareEventsBody = await shareEventsResponse.json();
              const shareEventsCors = shareEventsResponse.headers.get('access-control-allow-origin');
              const finaleStatsResponse = await fetch(finaleStatsUrl, { headers: { Origin: origin } });
              const finaleStatsBody = await finaleStatsResponse.json();
              const finaleStatsCors = finaleStatsResponse.headers.get('access-control-allow-origin');
              const reactionsReady = reactionsResponse.ok && reactionsBody.ok === true
                && reactionsBody.counts && reactionsBody.counts.api_smoke_read
                && reactionsCors === origin;
              const commentsReady = commentsResponse.ok && commentsBody.ok === true
                && Number.isInteger(commentsBody.counts?.api_smoke_read)
                && commentsCors === origin
                && commentDetailResponse.ok && commentDetailBody.ok === true
                && Array.isArray(commentDetailBody.comments) && Number.isInteger(commentDetailBody.count)
                && commentDetailCors === origin;
              const surveyReady = surveyResponse.ok && surveyBody.ok === true
                && surveyBody.poll === 'summer_2026' && Number.isInteger(surveyBody.results?.total)
                && surveyBody.results?.questions?.score?.counts && surveyCors === origin;
              const coachSurveyReady = coachSurveyResponse.ok && coachSurveyBody.ok === true
                && coachSurveyBody.poll === 'maresca_league_debut_2026' && Number.isInteger(coachSurveyBody.results?.total)
                && coachSurveyBody.results?.questions?.score?.counts
                && coachSurveyBody.results?.questions?.adjustments?.counts
                && coachSurveyBody.results?.questions?.tactics?.counts
                && coachSurveyBody.results?.questions?.concerns?.counts
                && coachSurveyBody.results?.questions?.outlook?.counts
                && coachSurveyCors === origin;
              const departureSurveyReady = departureSurveyResponse.ok && departureSurveyBody.ok === true
                && departureSurveyBody.poll === 'summer_departure_heartbreak_2026'
                && Number.isInteger(departureSurveyBody.results?.total)
                && departureSurveyBody.results?.questions?.departures?.counts
                && departureSurveyCors === origin;
              const reservationsReady = reservationsResponse.ok && reservationsBody.ok === true
                && reservationsBody.feature === 'loan_watch_2026'
                && Number.isInteger(reservationsBody.count) && reservationsBody.count >= 120
                && typeof reservationsBody.reserved === 'boolean' && reservationsCors === origin;
              const shareEventsReady = shareEventsResponse.ok && shareEventsBody.ok === true && shareEventsCors === origin;
              const finaleStatsReady = finaleStatsResponse.ok && finaleStatsBody.ok === true
                && ['votes', 'prayers', 'reactions', 'comments', 'shares'].every((key) => Number.isInteger(finaleStatsBody[key]))
                && finaleStatsCors === origin;
              const seasonBlessingReady = seasonBlessingResponse.ok && seasonBlessingBody.ok === true
                && Number.isInteger(seasonBlessingBody.count) && seasonBlessingBody.count >= 0
                && seasonBlessingCors === origin;
              if (response.ok && body.ok === true && Number.isInteger(body.count) && cors === origin && seasonBlessingReady && reactionsReady && commentsReady && surveyReady && coachSurveyReady && departureSurveyReady && reservationsReady && shareEventsReady && finaleStatsReady) {
                console.log(`Direct interactions ready: prayer=${body.count}, season-blessing=${seasonBlessingBody.count}, reactions=ok, comments=ok, surveys=ok, reservations=ok, share-events=ok, finale-stats=ok`);
                process.exit(0);
              }
              console.log(`Attempt ${attempt}: HTTP ${response.status}, CORS ${cors}`, body);
            } catch (error) {
              console.log(`Attempt ${attempt}: ${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          console.error('Prayer counter API did not become ready');
          process.exit(1);
          NODE

      - name: Require GitHub Pages deployment
        if: ${{ always() && steps.assemble.outcome == 'success' && steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success' }}
        run: |
          echo "::error::GitHub Pages 首次发布和自动重试均失败；Cloudflare 备用站已独立尝试更新"
          exit 1
